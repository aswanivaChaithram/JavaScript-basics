<html>
  <head>
     <script>
       function checkUser(username) {
          return new Promise((resolve, reject) => {
              setTimeout(() => {
                  if (username === "Priyaa") {
                      reject("Username already taken");
                    } else {
                      resolve("Username is available");
                    }
                  }, 1000);
                });
              }
       function registerUser(username) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve(`User ${username} registered successfully`);
                }, 1000);
            });
        }

        function sendWelcomeEmail(username) {
            return new Promise((resolve) => {
                setTimeout(() => {
                   resolve(`Welcome email sent to ${username}`);
                }, 1000);
            });
        }
        async function userRegistration() {
             try {
                 let username = "priyaa";
                 let checkResult = await checkUser(username);
                 console.log(checkResult);
                 let registerResult = await registerUser(username);
                 console.log(registerResult);
                 let emailResult = await sendWelcomeEmail(username);
                 console.log(emailResult);
                 console.log("Registration process completed successfully")} catch (error) {
                 console.log("Error:", error);
              }
        }
        userRegistration();
    </script>
  </head>
</html>
